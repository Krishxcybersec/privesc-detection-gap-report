title: SAM/SYSTEM Registry Hive Saved via reg.exe
id: 7a1b9f10-0c2e-4e8e-9a1a-1a2b3c4d5e05
status: experimental
description: >
    Detects reg.exe saving a password-bearing registry hive (SAM, SYSTEM or SECURITY).
    These hives hold local credential material and are normally inaccessible while
    Windows runs; saving them by hand is a hallmark of credential theft, often enabled
    by an account holding SeBackupPrivilege.
references:
    - https://attack.mitre.org/techniques/T1003/002/
author: Krishxcybersec
date: 2026-10-27
tags:
    - attack.credential-access
    - attack.t1003.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\reg.exe'
    selection_save_hive:
        # One pattern, so the parts are tied together:
        #   - `save` must be the reg SUBCOMMAND (straight after reg / reg.exe), not any
        #     "save" word in the line (e.g. `reg query ... /v save /s`);
        #   - the credential hive must be the SOURCE argument straight after `save`, so a
        #     destination path such as C:\backup\hklm\sam.hiv does not count;
        #   - the hive name must end there (HKLM\SAMPLE is not HKLM\SAM).
        CommandLine|re: '(?i)\breg(\.exe)?"?\s+save\s+"?(hklm|hkey_local_machine)\\(sam|system|security)(\\|"|\s|$)'
    condition: all of selection_*
falsepositives:
    - Administrators deliberately backing up a hive during maintenance. Should be rare
      and attributable to a known admin and change window.
    - Saving a SUBKEY of a credential hive (e.g. hklm\system\CurrentControlSet\...) also
      matches; it is less sensitive than the whole hive but still worth a look.
level: critical
