title: Unattended-Setup File Read by Command
id: 7a1b9f10-0c2e-4e8e-9a1a-1a2b3c4d5e09
status: experimental
description: >
    Detects a command reading a Windows unattended-setup answer file by name. These
    files (Unattend.xml, Autounattend.xml, sysprep.inf) may contain an administrator
    password in plain text or base64 and are often left readable after imaging, making
    them a direct source of credentials for a standard user.
references:
    - https://attack.mitre.org/techniques/T1552/001/
author: Krishxcybersec
date: 2026-10-27
tags:
    - attack.credential-access
    - attack.t1552.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_tool:
        Image|endswith:
            - '\cmd.exe'
            - '\more.com'
            - '\findstr.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\notepad.exe'
    selection_file:
        CommandLine|contains:
            - 'unattend.xml'
            - 'autounattend.xml'
            - 'sysprep.inf'
            - 'sysprep.xml'
    condition: selection_tool and selection_file
falsepositives:
    - Administrators or imaging scripts legitimately inspecting an answer file during a
      build. Should be rare on a finished, in-production host.
level: high
