title: Suspicious Child Process of msiexec Running as SYSTEM
id: 7a1b9f10-0c2e-4e8e-9a1a-1a2b3c4d5e02
status: experimental
description: >
    Detects a command interpreter or script host started by msiexec.exe. With the
    AlwaysInstallElevated policy enabled, an MSI package installed by a standard user
    runs as SYSTEM; a shell spawned from that install is a strong sign the policy is
    being abused for privilege escalation.
references:
    - https://attack.mitre.org/techniques/T1548/002/
author: Krishxcybersec
date: 2026-10-27
tags:
    - attack.privilege-escalation
    - attack.t1548.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith: '\msiexec.exe'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\conhost.exe'
            - '\reg.exe'
    condition: selection
falsepositives:
    - Legitimate installers that launch helper scripts during setup. Review the
      child command line and the integrity level to distinguish these.
level: high
