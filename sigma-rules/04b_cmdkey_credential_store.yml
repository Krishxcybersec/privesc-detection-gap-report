title: Credential Stored via cmdkey
id: 7a1b9f10-0c2e-4e8e-9a1a-1a2b3c4d5e08
status: experimental
description: >
    Detects cmdkey.exe storing a credential in Windows Credential Manager. A saved
    credential can later be reused with runas /savecred to run programs as that account
    without the password. Saving an administrator credential on a standard-user or shared
    host creates a reusable escalation path.
references:
    - https://attack.mitre.org/techniques/T1555/004/
author: Krishxcybersec
date: 2026-10-27
tags:
    - attack.credential-access
    - attack.t1555.004
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\cmdkey.exe'
        CommandLine|contains:
            - '/add'
            - '/generic'
    condition: selection
falsepositives:
    - Legitimate setup scripts that store service or network credentials. Review the
      account being stored and the context in which cmdkey ran.
level: medium
